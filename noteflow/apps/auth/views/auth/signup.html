{% extends "layout.html" %}
{% block content %}
<h1>Create account</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.signup') }}">
    {{ csrf_field(request) }}
    <label>Username <input name="username" value="{{ username }}" autocomplete="username" minlength="3" maxlength="30" required></label>
    <p>Use letters, numbers, or underscores. Usernames are stored in lowercase.</p>
    <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="email" maxlength="254" required></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="15" maxlength="128" required></label>
    <p>Use a passphrase of 15-128 characters.</p>
    <label>Confirm password <input type="password" name="confirm" autocomplete="new-password" minlength="15" maxlength="128" required></label>
    <button type="submit">Create account</button>
</form>
<p><a href="{{ url_for('auth.signin') }}">Already have an account?</a></p>
{% endblock %}
