{% extends "layout.html" %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.signin') }}">
    {{ csrf_field(request) }}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>Username <input name="username" value="{{ username }}" autocomplete="username" maxlength="30" required></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" maxlength="128" required></label>
    <button type="submit">Sign in</button>
</form>
<p><a href="{{ url_for('auth.signup') }}">Create an account</a></p>
{% endblock %}
