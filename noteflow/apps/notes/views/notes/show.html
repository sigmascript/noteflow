{% extends "layout.html" %}
{% block content %}
<h1>{{ note.title }}</h1>
<p>Created {{ note.created_at.strftime('%Y-%m-%d %H:%M') }} UTC</p>
<div class="note-content">{{ note.content }}</div>
<p><a href="{{ url_for('notes.edit', id=note.id) }}">Edit</a> · <a href="{{ url_for('notes.delete', id=note.id) }}">Delete</a></p>
<p><a href="{{ url_for('notes.index') }}">Back to notes</a></p>
{% endblock %}
