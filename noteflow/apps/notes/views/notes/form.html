{% extends "layout.html" %}
{% block content %}
<h1>{{ title }}</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ action }}">
    {{ csrf_field(request) }}
    <label>Title <input name="title" value="{{ values.title }}" maxlength="200" required></label>
    <label>Content <textarea name="content" rows="12" maxlength="20000" required>{{ values.content }}</textarea></label>
    <button type="submit">Save note</button>
</form>
<p><a href="{{ url_for('notes.index') }}">Back to notes</a></p>
{% endblock %}
